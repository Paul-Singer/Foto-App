<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FotoApp</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <header>
        <h1>FotoApp</h1>
    </header>

    <main id="gallery">
        <!-- Hier erscheinen die Fotos -->
    </main>

    <!-- Detail Ansicht Modal -->
    <div id="photo-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <img id="modal-img" src="" alt="Vollbild Foto">
            <p id="photo-meta" style="color: white; font-size: 0.8rem; margin: 10px 0;"></p>
            <div class="modal-actions">
                <button id="edit-btn">Bearbeiten</button>
                <button id="share-btn" style="background-color: #2dd36f; color: white;">Teilen</button>
                <button id="delete-modal-btn" class="danger">Löschen</button>
            </div>
        </div>
    </div>

    <!-- Lade-Overlay -->
    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
        <p>Bitte warten...</p>
    </div>

    <button id="camera-btn" class="fab">
        📸
    </button>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
