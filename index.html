<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foto-App</title>
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <header>
        <h1>Foto-App</h1>
    </header>

    <!-- Galerie-Ansicht -->
    <main id="gallery" class="gallery">
        <!-- Fotos werden hier dynamisch eingefügt -->
    </main>

    <!-- Detailansicht Modal -->
    <div id="photoModal" class="modal hidden">
        <div class="modal-content">
            <span id="closeModal" class="close">&times;</span>
            <img id="modalImage" src="" alt="Detailansicht">

            <div class="modal-actions">
                <button id="editBtn" class="btn-primary">Bearbeiten</button>
                <button id="deleteBtn" class="btn-danger">Löschen</button>
            </div>
        </div>
    </div>

    <!-- Ladeanzeige -->
    <div id="loadingIndicator" class="loading-overlay hidden">
        <div class="spinner"></div>
        <p id="loadingMessage">Fotos werden geladen ...</p>
    </div>

    <!-- Schwebender Button für die Kamera -->
    <button id="cameraBtn" class="fab">📸</button>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
